name: Pronostics football

on:
  schedule:
    - cron: "17 5 * * *"      # matin (UTC) : régénère le site ; les notifications du jour partent au premier de ces passages qui réussit
    - cron: "47 5 * * *"      # (GitHub retarde ou saute parfois des exécutions planifiées : d'où plusieurs créneaux)
    - cron: "37 6 * * *"
    - cron: "17 21 * * *"     # soir (UTC) : bilan du jour (une seule notification par jour)
    - cron: "47 22 * * *"
    - cron: "23 7-21/2 * * *" # toutes les 2 h dans la journée : tennis et résultats à jour (minutes décalées : les heures rondes sont saturées)
  workflow_dispatch:          # bouton « Run workflow » pour relancer à la main (sans notification)
  push:
    branches: [main]

permissions:
  contents: write             # pour sauvegarder le suivi des pronostics (data/tracking.json)
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests du moteur de marchés (probabilités valides, totaux à 100 %)
        id: tests
        run: node tests/engine_test.js
        continue-on-error: true       # avertit sans bloquer le déploiement
      - name: Contrôle du règlement des pronostics (recalcul indépendant à partir des scores)
        id: audit
        run: python tests/settlement_audit.py
        continue-on-error: true
      - name: Prévenir si un test échoue
        if: steps.tests.outcome == 'failure' || steps.audit.outcome == 'failure'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then curl -s -H "Title: Pronostics : un contrôle automatique a échoué" -H "Tags: warning" -d "Un calcul ou un règlement de pronostic est incohérent. Voir l'onglet Actions de GitHub." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true; fi
      - name: Générer le site (et notifier si exécution quotidienne)
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bot.py --html --notify-morning --notify-evening
      - name: Mail du matin (une fois par jour, seulement s'il y a des pronostics sûrs)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_digest.py
      - name: Sauvegarde hebdomadaire du suivi par mail (le dimanche, hors de GitHub)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python backup_mail.py
      - name: Contrôle du site généré
        run: python selfcheck.py
        continue-on-error: true       # avertit sans bloquer le déploiement
      - name: Sauvegarder le suivi des pronostics
        if: always()                  # même après un échec : sinon l'état des envois est perdu et tout est renvoyé au passage suivant
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in tracking odds_cache apif_cache tennis_model tennis_matches notify_state results_log match_log ext_log espn_leagues logos tsdb_cache apif_cal strength_log basket_games rugby_games handball_games handball_window hockey_games baseball_games nfl_games mma_fights golf_rounds golf_backtest volley_games volley_window f1_races f1_backtest; do
            if [ -f "data/$f.json" ]; then git add -f "data/$f.json"; fi      # un par un : un fichier absent ne doit pas empêcher d'enregistrer les autres (notify_state.json n'était plus sauvegardé)
          done
          if ! git diff --cached --quiet; then
            git commit -m "Suivi du $(date +%F)"
            for i in 1 2 3 4; do            # si quelqu'un a poussé pendant ce run, on se recale dessus (nos fichiers de suivi gagnent) puis on repousse
              git pull --rebase --autostash -X theirs origin main && git push && break
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
          fi
      - name: Garder uniquement les fichiers du site (le mail du matin est lu depuis digest.txt / digest.html)
        run: rm -f output/artifact.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Battement de cœur : GitHub saute souvent les exécutions planifiées. Ce travail attend ~1 h 50 puis relance le workflow,
  # ce qui garde une exécution toutes les 2 h même si le planificateur est défaillant. Un battement plus récent annule le précédent.
  heartbeat:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 140
    concurrency:
      group: heartbeat
      cancel-in-progress: true
    permissions:
      actions: write
    steps:
      - run: sleep 6600
      - name: Relancer le workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

name: Pronostics football

on:
  schedule:
    - cron: "17 5 * * *"      # matin (UTC) : régénère le site ; les notifications du jour partent au premier de ces passages qui réussit
    - cron: "47 5 * * *"      # (GitHub retarde ou saute parfois des exécutions planifiées : d'où plusieurs créneaux)
    - cron: "37 6 * * *"
    - cron: "17 21 * * *"     # soir (UTC) : bilan du jour (une seule notification par jour)
    - cron: "47 22 * * *"
    - cron: "23 7-21/2 * * *" # toutes les 2 h dans la journée : tennis et résultats à jour (minutes décalées : les heures rondes sont saturées)
  workflow_dispatch:          # bouton « Run workflow » pour relancer à la main (sans notification)
  push:
    branches: [main]

permissions:
  contents: write             # pour sauvegarder le suivi des pronostics (data/tracking.json)
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Générer le site (et notifier si exécution quotidienne)
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bot.py --html --notify-morning --notify-evening
      - name: Contrôle du site généré
        run: python selfcheck.py
        continue-on-error: true       # avertit sans bloquer le déploiement
      - name: Sauvegarder le suivi des pronostics
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f data/tracking.json data/apif_cache.json data/tennis_model.json data/tennis_matches.json data/notify_state.json data/results_log.json data/match_log.json data/ext_log.json data/espn_leagues.json data/logos.json data/basket_games.json data/rugby_games.json data/handball_games.json data/handball_window.json data/hockey_games.json data/baseball_games.json data/nfl_games.json data/mma_fights.json data/golf_rounds.json data/golf_backtest.json data/volley_games.json data/volley_window.json data/f1_races.json data/f1_backtest.json 2>/dev/null || git add data/tracking.json
          git diff --cached --quiet || (git commit -m "Suivi du $(date +%F)" && git push)
      - name: Garder uniquement les fichiers du site (le mail du matin est lu depuis digest.txt / digest.html)
        run: rm -f output/artifact.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Battement de cœur : GitHub saute souvent les exécutions planifiées. Ce travail attend ~1 h 50 puis relance le workflow,
  # ce qui garde une exécution toutes les 2 h même si le planificateur est défaillant. Un battement plus récent annule le précédent.
  heartbeat:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 140
    concurrency:
      group: heartbeat
      cancel-in-progress: true
    permissions:
      actions: write
    steps:
      - run: sleep 6600
      - name: Relancer le workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
